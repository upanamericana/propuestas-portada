<style>
  /* =========================================================
     PORTADA · Posgrados Panamericana
     La ilustración del concepto de la unidad (guion en insumos/ILUSTRACIONES.md)
     ocupa la mitad derecha sobre el verde hondo, como la foto fundida de Andina:
     el documento de la recomendación, en el lenguaje de los diplomas del manual,
     con un solo Tahalí dorado a toda altura cruzando detrás (Master graphic B,
     p. 228). El Franco Cuartel es la pantalla entera. La cabeza va en Laurentian
     Semibold EN ALTAS, partida en sílabas, alineada a la izquierda (p. 213); el
     destacado, en bajas (p. 214). El CSS de portada viaja por curso (igual que en
     Scala y Andina).
     ========================================================= */
  .up-portada{
    position:relative; overflow:hidden; isolation:isolate;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center;
    background: linear-gradient(118deg, #072E29 0%, #0A4039 58%, #0B4740 100%);
    color:#fff;
  }
  /* un solo Tahalí dorado a toda altura, detrás de la pieza (como en los carteles del
     Master graphic B, p. 228: la banda cruza detrás del protagonista) */
  /* La caja mide ~0,62 de alto por ancho para que la banda (el 36 % de la caja) caiga a
     unos 60° como en el manual, y no como una varilla vertical. */
  .up-portada__tahali{
    position:absolute; z-index:1; top:-4%; bottom:-4%; right:clamp(120px, 13vw, 200px);
    width:clamp(300px, 34vw, 560px);
    background:var(--up-tahali-dorado) center / 100% 100% no-repeat;
    opacity:.95;
  }
  /* la ilustración, grande, centrada en la mitad derecha */
  .up-portada__ilustracion{
    position:absolute; z-index:2; top:50%; transform:translateY(-50%);
    right:clamp(8px, 2vw, 40px);
    width:min(44vw, 640px); max-height:96vh;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .up-portada__ilustracion img{ display:block; width:100%; height:auto; }

  /* En escritorio la escena cubre la portada entera y no ocupa flujo; en móvil (regla de
     abajo) pasa a franja relativa arriba del texto. La media query va después: gana. */
  .up-portada__escena{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .up-portada__inner{
    position:relative; z-index:3;
    width:100%; max-width:1240px; margin:0 auto;
    padding:clamp(32px, 6vw, 88px);
  }
  .up-portada__texto{ max-width:560px; }
  .up-portada__logo img{ height:116px; width:auto; display:block; margin-bottom:clamp(28px, 5vh, 56px); }
  .up-portada__eyebrow{
    display:inline-flex; align-items:center; gap:12px;
    font-family:var(--font-body); font-weight:600; font-size:.8rem;
    letter-spacing:.24em; text-transform:uppercase;
    color:var(--c-dorado-claro); margin-bottom:22px;
  }
  .up-portada__eyebrow::before{
    content:''; width:16px; height:10px;
    background:var(--up-eyebrow) left center / contain no-repeat;
  }
  /* la cabeza: altas, interlínea 0,85 del puntaje (p. 213), partición silábica */
  .up-portada__title{
    margin:0 0 22px; color:#fff;
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(2.4rem, 5vw, 3.9rem); line-height:.92; letter-spacing:.01em;
    text-transform:uppercase;
    -webkit-hyphens:auto; hyphens:auto; hyphenate-limit-chars:8 4 4;
  }
  .up-portada__title .up-suave{ color:rgba(255,255,255,.74); font-weight:400; }
  /* el destacado del titular: en bajas, Bold, dorado claro (p. 214) */
  .up-portada__title .up-destacado{
    display:block; margin-top:.28em;
    text-transform:none; font-weight:700; letter-spacing:-.015em;
    font-size:.78em; line-height:1.02;
    color:var(--c-dorado-claro);
  }
  /* Título largo: un escalón menos para que título, subtítulo, frase y botón
     sigan cabiendo en la primera pantalla. Se acorta el tamaño, nunca el título. */
  .up-portada__title--largo{ font-size:clamp(2rem, 4.1vw, 3.2rem); }
  /* la línea fina bajo el titular */
  .up-portada__sub{
    margin:0 0 28px; padding-top:16px;
    border-top:1px solid rgba(255,255,255,.28);
    max-width:440px;
    color:rgba(255,255,255,.86);
    font-size:clamp(1rem, 1.5vw, 1.15rem); font-weight:300; letter-spacing:.02em;
  }
  .up-portada__quote{
    color:#fff; font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:clamp(1.12rem, 1.8vw, 1.36rem); line-height:1.48;
    max-width:500px; margin:0 0 38px;
    padding-left:20px; border-left:3px solid var(--c-dorado);
  }
  /* CTA rectangular blanco: sobre el verde hondo el dorado nunca es un control */
  .up-portada__acciones{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .up-portada__cta{
    display:inline-flex; align-items:center; gap:10px;
    background:#fff; color:var(--c-acento); text-decoration:none;
    font-family:var(--font-body); font-weight:600; font-size:1rem; letter-spacing:.02em;
    padding:16px 30px; border-radius:var(--r-md);
    box-shadow:0 14px 34px rgba(4,30,26,.40);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  }
  /* el color se fija también en hover: el motor tiñe todo enlace en hover */
  .up-portada__cta:hover,
  .up-portada__cta:focus-visible{ background:var(--c-dorado-claro); color:var(--c-deep); transform:translateY(-2px); }
  .up-portada__descarga{
    display:inline-grid; place-items:center;
    width:52px; height:52px; border-radius:var(--r-md);
    color:#fff; text-decoration:none;
    border:1.5px solid rgba(255,255,255,.5);
    transition:border-color .2s ease;
  }
  .up-portada__descarga svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
  .up-portada__descarga .up-flecha{ transition:transform .28s cubic-bezier(.34,1.4,.64,1); }
  .up-portada__descarga:hover, .up-portada__descarga:focus-visible{ border-color:#fff; color:#fff; }
  .up-portada__descarga:hover .up-flecha, .up-portada__descarga:focus-visible .up-flecha{ transform:translateY(3.5px); }

  @media (prefers-reduced-motion: reduce){
    .up-portada__descarga .up-flecha{ transition:none; }
    .up-portada__cta{ transition:none; }
  }
  /* Móvil: la foto no se oculta; pasa arriba, a franja horizontal, y el texto debajo */
  @media (max-width: 900px){
    .up-portada{ flex-direction:column; align-items:stretch; }
    .up-portada__escena{ position:relative; width:100%; height:min(96vw, 440px); overflow:hidden; }
    .up-portada__tahali{ right:auto; left:-6%; width:64%; top:-10%; bottom:-10%; }
    .up-portada__ilustracion{ right:50%; transform:translate(50%,-50%); width:min(82%, 400px); max-height:none; }
    .up-portada__inner{ padding-top:28px; }
    .up-portada__logo img{ height:84px; margin-bottom:24px; }
    .up-portada__quote{ font-size:1.05rem; max-width:none; }
    .up-portada__texto{ max-width:none; }
  }
</style>

<script>
  const main = document.getElementById('prop-main');
  function montar(p) {
    main.replaceChildren(document.getElementById('prop-' + p).content.cloneNode(true));
    document.querySelectorAll('.prop-nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.p === p)));
    document.title = 'Propuesta ' + p + ' · portada · Posgrados Panamericana';
  }
  document.querySelector('.prop-nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-p]');
    if (b) location.hash = b.dataset.p;
  });
  /* el visor es solo la portada: los enlaces al resto del curso no existen aquí */
  main.addEventListener('click', e => { if (e.target.closest('a[href$=".html"]')) e.preventDefault(); });
  /* #1…#5; las letras de los primeros enlaces (#A…#E) siguen funcionando */
  const LETRAS = { A: '1', B: '2', C: '3', D: '4', E: '5' };
  const leer = () => {
    const h = location.hash.slice(1).toUpperCase();
    montar(/^[1-8]$/.test(h) ? h : LETRAS[h] || '1');
  };
  addEventListener('hashchange', leer);
  leer();
</script>
