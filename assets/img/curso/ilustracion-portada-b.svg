<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img"
     aria-label="La hoja de la recomendación, enorme, en crema con doble filete dorado, recortada por el borde de la pantalla: seis barras, dos de ellas señaladas en trazo punteado, y el sello dorado de verificación con sus cintas.">
  <!-- Ilustración de marca · Posgrados Panamericana · portada · PROPUESTA B «A sangre»
       La misma hoja de la recomendación de la versión 2 (insumos/ILUSTRACIONES.md), pero a
       escala de cartel: ocupa más que el encuadre y el marco la recorta por la derecha y por
       abajo, como la foto fundida de las portadas de Andina. Variante sobre oscuro (§1.7):
       sin fondo propio; un solo dorado: el sello. -->
  <defs>
    <radialGradient id="ilu-portada-b-luz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3F7D74" stop-opacity=".6"/>
      <stop offset="55%" stop-color="#3F7D74" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#3F7D74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ilu-portada-b-hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#EFE9DB"/>
    </linearGradient>
    <linearGradient id="ilu-portada-b-sello" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9C9A3"/>
      <stop offset="100%" stop-color="#B9975B"/>
    </linearGradient>
  </defs>

  <!-- halo de luz: la fuente contra la que se comprueba -->
  <circle cx="520" cy="520" r="540" fill="url(#ilu-portada-b-luz)"/>

  <g transform="rotate(-7 600 600)">
    <!-- sombra de la hoja -->
    <rect x="214" y="156" width="860" height="1120" fill="#041F1B" opacity=".45"/>
    <rect x="198" y="138" width="860" height="1120" fill="#06302A" opacity=".35"/>
    <!-- la hoja: más grande que el encuadre -->
    <rect x="180" y="120" width="860" height="1120" fill="url(#ilu-portada-b-hoja)"/>
    <!-- doble filete dorado, como los diplomas (pp. 48-50) -->
    <rect x="212" y="152" width="796" height="1056" fill="none" stroke="#B9975B" stroke-width="3" opacity=".85"/>
    <rect x="226" y="166" width="768" height="1028" fill="none" stroke="#B9975B" stroke-width="1.2" opacity=".55"/>
    <!-- marcas de esquina -->
    <g stroke="#B9975B" stroke-width="3" opacity=".9" fill="none">
      <path d="M242 206 v-22 h22"/><path d="M978 206 v-22 h-22"/>
    </g>

    <!-- cabecera del documento -->
    <rect x="282" y="248" width="300" height="22" fill="#0F5C51"/>
    <rect x="282" y="294" width="470" height="10" fill="#0A4039" opacity=".28"/>
    <rect x="282" y="320" width="380" height="10" fill="#0A4039" opacity=".28"/>

    <!-- las seis semanas; dos señaladas por la IA, en punteado, ya comprobadas -->
    <g>
      <rect x="282" y="620" width="72" height="170" fill="#0F5C51" opacity=".30"/>
      <rect x="388" y="560" width="72" height="230" fill="#0F5C51" opacity=".30"/>
      <rect x="494" y="430" width="72" height="360" fill="#0F5C51"/>
      <rect x="600" y="390" width="72" height="400" fill="#0F5C51"/>
      <rect x="706" y="590" width="72" height="200" fill="#0F5C51" opacity=".30"/>
      <rect x="812" y="640" width="72" height="150" fill="#0F5C51" opacity=".30"/>
      <rect x="474" y="366" width="218" height="446" fill="none" stroke="#0F5C51" stroke-width="4.5" stroke-dasharray="14 11"/>
      <line x1="282" y1="792" x2="884" y2="792" stroke="#0A4039" stroke-width="3" opacity=".4"/>
    </g>

    <!-- el texto de la recomendación -->
    <rect x="282" y="860" width="600" height="10" fill="#0A4039" opacity=".28"/>
    <rect x="282" y="888" width="540" height="10" fill="#0A4039" opacity=".28"/>
    <rect x="282" y="916" width="330" height="10" fill="#0A4039" opacity=".28"/>

    <!-- el sello: la afirmación queda verificada, no solo aceptada -->
    <g transform="translate(780 900)">
      <polygon points="-40,30 -10,30 14,130 -16,130" fill="#B9975B" opacity=".9"/>
      <polygon points="6,30 36,30 60,130 30,130" fill="#D9C9A3" opacity=".9"/>
      <circle cx="0" cy="0" r="100" fill="#0A4039" opacity=".18"/>
      <circle cx="0" cy="0" r="90" fill="url(#ilu-portada-b-sello)"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#FFFDF8" stroke-width="3" opacity=".7"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#0A4039" stroke-width="2" opacity=".35"/>
      <path d="M-32 4 L-10 26 L36 -22" fill="none" stroke="#0A4039" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
