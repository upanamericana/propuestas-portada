<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img"
     aria-label="Una hoja de recomendación en crema, con filetes dorados como un diploma: muestra seis barras con dos señaladas en trazo punteado y un sello dorado con una marca de verificación en la esquina. Detrás, un halo de luz.">
  <!-- Ilustración de marca · Posgrados Panamericana · portada (variante sobre oscuro, §1.7)
       La recomendación que alguien puede respaldar: la respuesta de la IA (dos de las seis
       semanas, en punteado) ya comprobada, sobre el documento que llega a quien aprueba, con
       el sello de verificación. Un solo dorado: el sello. El lenguaje es el de los diplomas
       del manual (pp. 48-50): hoja crema con doble filete. -->
  <defs>
    <radialGradient id="ilu-portada-luz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3F7D74" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#3F7D74" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#3F7D74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ilu-portada-hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F1ECE0"/>
    </linearGradient>
    <linearGradient id="ilu-portada-sello" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9C9A3"/>
      <stop offset="100%" stop-color="#B9975B"/>
    </linearGradient>
  </defs>

  <!-- halo de luz: la fuente contra la que se comprueba -->
  <circle cx="470" cy="450" r="420" fill="url(#ilu-portada-luz)"/>

  <g transform="rotate(-6 450 470)">
    <!-- sombra de la hoja -->
    <rect x="212" y="166" width="520" height="650" fill="#041F1B" opacity=".45"/>
    <rect x="200" y="152" width="520" height="650" fill="#06302A" opacity=".35"/>
    <!-- la hoja -->
    <rect x="190" y="140" width="520" height="650" fill="url(#ilu-portada-hoja)"/>
    <!-- doble filete dorado, como los diplomas -->
    <rect x="212" y="162" width="476" height="606" fill="none" stroke="#B9975B" stroke-width="2.5" opacity=".85"/>
    <rect x="222" y="172" width="456" height="586" fill="none" stroke="#B9975B" stroke-width="1" opacity=".55"/>
    <!-- marcas de esquina -->
    <g stroke="#B9975B" stroke-width="2.5" opacity=".9" fill="none">
      <path d="M232 196 v-14 h14"/><path d="M668 196 v-14 h-14"/>
      <path d="M232 734 v14 h14"/><path d="M668 734 v14 h-14"/>
    </g>

    <!-- cabecera del documento -->
    <rect x="262" y="228" width="190" height="14" fill="#0F5C51"/>
    <rect x="262" y="258" width="300" height="7" fill="#0A4039" opacity=".28"/>
    <rect x="262" y="276" width="240" height="7" fill="#0A4039" opacity=".28"/>

    <!-- las seis semanas; dos señaladas por la IA, en punteado, ya comprobadas -->
    <g>
      <rect x="262" y="440" width="40" height="110" fill="#0F5C51" opacity=".30"/>
      <rect x="318" y="408" width="40" height="142" fill="#0F5C51" opacity=".30"/>
      <rect x="374" y="340" width="40" height="210" fill="#0F5C51"/>
      <rect x="430" y="318" width="40" height="232" fill="#0F5C51"/>
      <rect x="486" y="424" width="40" height="126" fill="#0F5C51" opacity=".30"/>
      <rect x="542" y="452" width="40" height="98" fill="#0F5C51" opacity=".30"/>
      <rect x="362" y="302" width="120" height="262" fill="none" stroke="#0F5C51" stroke-width="3" stroke-dasharray="9 8"/>
      <line x1="262" y1="551" x2="638" y2="551" stroke="#0A4039" stroke-width="2" opacity=".4"/>
    </g>

    <!-- el texto de la recomendación -->
    <rect x="262" y="594" width="376" height="7" fill="#0A4039" opacity=".28"/>
    <rect x="262" y="612" width="340" height="7" fill="#0A4039" opacity=".28"/>
    <rect x="262" y="630" width="210" height="7" fill="#0A4039" opacity=".28"/>

    <!-- el sello: la afirmación queda verificada, no solo aceptada -->
    <g transform="translate(596 690)">
      <!-- cintas del sello, en miniatura el Tahalí -->
      <polygon points="-26,20 -6,20 10,86 -10,86" fill="#B9975B" opacity=".9"/>
      <polygon points="4,20 24,20 40,86 20,86" fill="#D9C9A3" opacity=".9"/>
      <circle cx="0" cy="0" r="64" fill="#0A4039" opacity=".18"/>
      <circle cx="0" cy="0" r="58" fill="url(#ilu-portada-sello)"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#FFFDF8" stroke-width="2" opacity=".7"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#0A4039" stroke-width="1.5" opacity=".35"/>
      <path d="M-20 2 L-6 16 L22 -14" fill="none" stroke="#0A4039" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
